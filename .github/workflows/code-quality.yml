name: Code Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'packages/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'packages/**'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Check formatting
        run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run lint
        run: pnpm lint:check
